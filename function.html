function generateRandomMove()
{
    // Math.random() 0 se lekar 1 ke beech random decimal number deta hai
    let random = Math.random();

    // Random number ko 3 se multiply kiya
    // Ab value 0 se 3 ke beech aa jayegi
    let randomMove = random * 3;

    // Jo value bani hai usko function ke bahar return kar diya
    return randomMove;
}
